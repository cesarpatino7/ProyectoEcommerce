version: '3.8'

services:
  postgres-db:

    image: postgres:15-alpine

    container_name: ecommerce-postgres-db

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ecommerce_db

    ports:
      - "5432:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql/data

    restart: unless-stopped